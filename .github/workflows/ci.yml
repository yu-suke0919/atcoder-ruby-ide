name: Test and build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The runtime the app places in WSL: Ruby 3.4.5 built here, gems, Ruby LSP and the agent.
  # Ubuntu 22.04 keeps glibc old enough for the Ubuntu that `wsl --install` sets up.
  wsl-runtime:
    runs-on: ubuntu-22.04
    # Puts the image on the wsl-images release, where the app downloads it from.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: wsl-agent
      # The built Ruby, gems and Ruby LSP, kept so that the version stays the same (scripts/build-wsl-runtime.sh).
      - uses: actions/cache@v4
        with:
          path: .cache/wsl
          key: wsl-runtime-${{ hashFiles('config/ruby-wsl.json', 'config/atcoder-runtime.json', 'config/ruby-lsp.json', 'scripts/build-wsl-runtime.sh', 'scripts/prepare-gems.cjs', 'scripts/prepare-lsp.cjs', 'scripts/install-gems.rb', 'scripts/download-verified.cjs') }}
      - name: Install the Ruby build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libyaml-dev libffi-dev zlib1g-dev libgmp-dev
      - run: npm run prepare:wsl
      - name: Check the distribution through its agent as atcoder
        timeout-minutes: 10
        run: npm run check:wsl
      - name: Put the image on the wsl-images release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-wsl-image.cjs
      # Only runtime.json: the Windows app downloads the image from the release.
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-runtime
          path: vendor/wsl/
          if-no-files-found: error
          retention-days: 14

  linux:
    # Pinned: setup-ruby builds only the latest 3.4.x for newer images, and AtCoder uses 3.4.5.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: tauri-desktop
      - name: Read pinned Ruby patch
        id: ruby
        run: node -e "console.log('version=' + require('./config/ruby-wsl.json').rubyVersion)" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}
      - run: npm ci
      - run: npm run prepare:gems
      - run: npm run prepare:lsp
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The desktop app is built only for Windows; its Windows target needs no WebKitGTK, so it is
      # checked here before the slower Windows job. vendor/wsl/ is a resource of the app.
      - name: Clippy over the Windows desktop app
        run: |
          mkdir -p vendor/wsl
          cargo clippy --locked --target x86_64-pc-windows-msvc --features desktop --bin atcoder-ruby-ide -- -D warnings
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser UI tests with the real Rust and Ruby backend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Linux-UI-failure
          path: test-results/
          if-no-files-found: ignore

  # Ruby runs in WSL: GitHub's Windows runners only have WSL1, which runs the same runtime.
  windows:
    needs: wsl-runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: tauri-desktop
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
      - uses: actions/download-artifact@v4
        with:
          name: wsl-runtime
          path: vendor/wsl
      - run: npm ci
      - run: npm run build:win
      - run: node scripts/package-windows.cjs --stage
      - name: Native GUI tests of the portable app with Ruby in WSL
        shell: pwsh
        run: |
          $env:APP_EXE = (Resolve-Path artifacts/portable/atcoder-ruby-ide.exe).Path
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS and smoke test the app with Ruby in WSL
        run: node scripts/test-installed-windows.cjs
      - name: Compress portable ZIP and measure distribution sizes
        run: npm run package:win
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-verification
          path: |
            artifacts/reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AtCoder-Ruby-IDE-Windows-x64-portable
          path: artifacts/*-portable.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AtCoder-Ruby-IDE-Windows-x64-setup
          path: artifacts/*-setup.exe
          if-no-files-found: error
          retention-days: 14

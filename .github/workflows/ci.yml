name: Test and build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      measure_ruby_stack:
        description: Measure Ruby stacks instead of running tests and builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ !inputs.measure_ruby_stack }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: tauri-desktop
      - name: Read pinned Ruby patch
        id: ruby
        run: node -e "console.log('version=' + require('./config/ruby-windows.json').rubyVersion)" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}
      - run: npm ci
      - run: npm run prepare:gems
      - run: npm run prepare:lsp
      - run: cargo fmt --all --check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser UI tests with the real Rust and Ruby backend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Linux-UI-failure
          path: test-results/
          if-no-files-found: ignore

  windows:
    if: ${{ !inputs.measure_ruby_stack }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: tauri-desktop
      - run: npm ci
      - run: npm run prepare:ruby
      - run: npm run prepare:lsp
      - name: Unit tests with the bundled Ruby
        shell: pwsh
        run: |
          $env:RUBY_PATH = (Resolve-Path vendor/ruby/bin/ruby.exe).Path
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build:win
      - run: node scripts/package-windows.cjs --stage
      - name: Native GUI tests of the portable app without system Ruby
        shell: pwsh
        run: |
          $env:APP_EXE = (Resolve-Path artifacts/portable/atcoder-ruby-ide.exe).Path
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS and smoke test the app without system Ruby
        run: node scripts/test-installed-windows.cjs
      - name: Compress portable ZIP and measure distribution sizes
        run: npm run package:win
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-verification
          path: |
            artifacts/reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AtCoder-Ruby-IDE-Windows-x64-portable
          path: artifacts/*-portable.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AtCoder-Ruby-IDE-Windows-x64-setup
          path: artifacts/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  ruby-stack:
    if: github.event_name == 'workflow_dispatch' && inputs.measure_ruby_stack
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read pinned Ruby patch
        id: ruby
        shell: bash
        run: node -e "console.log('version=' + require('./config/ruby-windows.json').rubyVersion)" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux'
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}
      - run: npm ci
        if: runner.os == 'Windows'
      - run: npm run prepare:ruby
        if: runner.os == 'Windows'
      - name: Measure VM sizes and process memory
        if: runner.os == 'Windows'
        run: ./scripts/measure-ruby-stack.ps1
      - name: Measure each and map recursion boundaries
        run: node scripts/measure-ruby-recursion.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ruby-stack-${{ runner.os }}
          path: artifacts/reports/ruby-*.json
          if-no-files-found: warn

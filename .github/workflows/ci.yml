name: Test and build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      measure_ruby_stack:
        description: Measure Ruby stacks instead of running tests and builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: tauri-desktop
      - run: npm ci
      - run: npm run build:win
      - name: U0 spike against the release exe
        shell: pwsh
        run: |
          $env:APP_EXE = (Resolve-Path target/release/atcoder-ruby-ide.exe).Path
          node tests/e2e/spike-browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: U0-spike
          path: test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: U0-spike-exe
          path: target/release/atcoder-ruby-ide.exe
          if-no-files-found: error
          retention-days: 14

  ruby-stack:
    if: github.event_name == 'workflow_dispatch' && inputs.measure_ruby_stack
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read pinned Ruby patch
        id: ruby
        shell: bash
        run: node -e "console.log('version=' + require('./config/ruby-windows.json').rubyVersion)" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux'
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}
      - run: npm ci
        if: runner.os == 'Windows'
      - run: npm run prepare:ruby
        if: runner.os == 'Windows'
      - name: Measure VM sizes and process memory
        if: runner.os == 'Windows'
        run: ./scripts/measure-ruby-stack.ps1
      - name: Measure each and map recursion boundaries
        run: node scripts/measure-ruby-recursion.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ruby-stack-${{ runner.os }}
          path: artifacts/reports/ruby-*.json
          if-no-files-found: warn

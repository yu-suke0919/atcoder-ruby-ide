name: Tauri distribution size probe

on:
  pull_request:
    paths:
      - 'experiments/tauri-size/**'
      - 'docs/tauri-size.md'
      - '.github/workflows/tauri-size.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/tauri-size/src-tauri
      - run: npm ci
      - run: npm run setup:electron
      - run: npm run prepare:ruby
      - name: Use the same Ruby for runner tests
        shell: pwsh
        run: '"RUBY_PATH=$((Resolve-Path vendor/ruby/bin/ruby.exe).Path)" >> $env:GITHUB_ENV'
      - run: npm ci --prefix experiments/tauri-size
      - run: npm test --prefix experiments/tauri-size
      - run: cargo test --locked --manifest-path experiments/tauri-size/src-tauri/Cargo.toml --test runner
      - run: npm run build:win
      - run: npm run build --prefix experiments/tauri-size
      - name: Compare the complete Ruby payload and distribution sizes
        run: node experiments/tauri-size/measure.cjs
      - name: Verify the portable and installed Tauri apps with their bundled Ruby
        run: node experiments/tauri-size/verify-windows.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tauri-size-probe-Windows-x64
          path: |
            experiments/tauri-size/artifacts/size-report.*
            experiments/tauri-size/artifacts/tauri-portable.zip
            experiments/tauri-size/artifacts/tauri-setup.exe
            experiments/tauri-size/artifacts/*.png
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

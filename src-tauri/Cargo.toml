[package]
name = "atcoder-ruby-ide"
version = "0.2.0"
edition = "2021"
default-run = "atcoder-ruby-ide"

[lib]
path = "lib.rs"

[[bin]]
name = "atcoder-ruby-ide"
path = "main.rs"
required-features = ["desktop"]

[features]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls-no-alpn", "system-proxy"] }
scraper = { version = "=0.29.0", default-features = false }
url = "=2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
base64 = "=0.23.1"
quick-xml = "=0.42.0"
cssparser = "=0.38.0"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }


[[test]]
name = "contract"
path = "../tests/contract.rs"
[[test]]
name = "library"
path = "../tests/library.rs"

[package]
name = "atcoder-ruby-ide"
version = "0.2.0"
edition = "2021"
default-run = "atcoder-ruby-ide"

[lib]
path = "lib.rs"

[[bin]]
name = "atcoder-ruby-ide"
path = "main.rs"
required-features = ["desktop"]

# Runs Ruby and Ruby LSP inside WSL for the app (docs/architecture.md#wslのエージェント).
[[bin]]
name = "atcoder-ruby-agent"
path = "agent_main.rs"

[features]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-window-state"]

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls-no-alpn", "system-proxy"] }
scraper = { version = "=0.29.0", default-features = false }
url = "=2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri = { version = "2", optional = true, features = ["unstable"] }
tauri-plugin-window-state = { version = "2", optional = true }
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_SystemServices"] }


[[test]]
name = "contract"
path = "../tests/contract.rs"
[[test]]
name = "library"
path = "../tests/library.rs"
[[test]]
name = "agent"
path = "../tests/agent.rs"
[[test]]
name = "wsl"
path = "../tests/wsl.rs"
[[test]]
name = "ruby_lsp"
path = "../tests/ruby_lsp.rs"
